  .modulex-referans-sponsor-kademe-kat--0 .modulex-referans-sponsor-kademe-sponsor > * { min-height: 220px; padding: clamp(22px, 3vw, 36px); border: 2px solid --accent--; border-radius: calc(--yuvarlak-- * 1.4); box-shadow: 0 28px 50px -38px color-mix(in srgb, --accent-- 90%, transparent); }

  .modulex-referans-sponsor-kademe-salt { color: --muted--; font-size: 0.74rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .modulex-referans-sponsor-kademe-kat--2 .modulex-referans-sponsor-kademe-salt, .modulex-referans-sponsor-kademe-kat--1 .modulex-referans-sponsor-kademe-sm, .modulex-referans-sponsor-kademe-kat--2 .modulex-referans-sponsor-kademe-sm { display: none; }
  .modulex-referans-sponsor-kademe-sm { max-width: 38ch; color: --muted--; font-size: 0.95rem; line-height: 1.6; }

  .modulex-referans-sponsor-kademe-logo { display: block; width: auto; max-width: 100%; height: clamp(32px, 4vw, 48px); object-fit: contain; filter: grayscale(1); transition: filter 0.3s ease, transform 0.3s ease; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-referans-sponsor-kademe :is(.modulex-referans-sponsor-kademe-baslik, .modulex-referans-sponsor-kademe-ust, h3, h4, strong) { letter-spacing: 0; }

  @media (prefers-reduced-motion: reduce) {
    .modulex-referans-sponsor-kademe *, .modulex-referans-sponsor-kademe *::before, .modulex-referans-sponsor-kademe *::after { animation: none !important; transition: none !important; }

</style>
<script>
  (() => {
    const P = "modulex-referans-sponsor-kademe";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
    });
  })();
</script>
