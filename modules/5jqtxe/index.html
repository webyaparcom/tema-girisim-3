<section class="modulex-yorum-terminal{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-yorum-terminal-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>

<style>
  /* yorum-terminal — Geliştirici/teknik dil: kart, avatar, alıntı işareti yok — tek eş aralıklı pencere içinde zamanlı yazma (clip-path adımları) ve sıralı belirme; yorum-zaman-akisi'nin düğümlü akışından ve yorum-sosyal-gonderi'nin kart dilinden farklı olarak tüm yorumlar tek bir konsol çıktısıdır. */
  .modulex-yorum-terminal { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-yorum-terminal *, .modulex-yorum-terminal *::before, .modulex-yorum-terminal *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-yorum-terminal :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-yorum-terminal :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-yorum-terminal :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-yorum-terminal :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-yorum-terminal img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-yorum-terminal) img { height: auto; }
  .modulex-yorum-terminal [hidden] { display: none !important; }
  .modulex-yorum-terminal :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-yorum-terminal :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-yorum-terminal-ic { max-width: --max--; margin-inline: auto; }
  .modulex-yorum-terminal-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-yorum-terminal--bassiz .modulex-yorum-terminal-bas { display: none; }
  .modulex-yorum-terminal-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-yorum-terminal-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-yorum-terminal-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-yorum-terminal-bas { max-width: 760px; }
  .modulex-yorum-terminal-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-yorum-terminal-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-yorum-terminal-dugme:hover { transform: translateY(-2px); }
  .modulex-yorum-terminal-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-yorum-terminal-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-yorum-terminal-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-yorum-terminal-ad { font-weight: 700; }
  .modulex-yorum-terminal-kisi { display: grid; gap: 2px; min-width: 0; }
  .modulex-yorum-terminal-unvan { color: --muted--; font-size: 0.88rem; line-height: 1.45; }
  .modulex-yorum-terminal-puan { display: flex; gap: 2px; color: --yildiz--; }
  .modulex-yorum-terminal-puan .material-symbols-outlined { font-size: 20px; font-variation-settings: "FILL" 1; }
  .modulex-yorum-terminal-yildiz--bos { opacity: 0.3; }
  .modulex-yorum-terminal-avatar { flex: none; width: 52px; height: 52px; border-radius: 50%; object-fit: cover; }
  .modulex-yorum-terminal-harf { display: inline-grid; place-items: center; background: color-mix(in srgb, --accent-- 18%, --kartBg--); color: --accentInk--; font-weight: 800; letter-spacing: 0.02em; }
  .modulex-yorum-terminal-yazar { display: flex; align-items: center; gap: 12px; }

  .modulex-yorum-terminal-pencere { max-width: 1000px; overflow: hidden; border: 1px solid color-mix(in srgb, --text-- 30%, transparent); border-radius: 14px; background-color: color-mix(in srgb, --text-- 93%, --accent--); color: --bg--; font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; font-size: 0.96rem; box-shadow: 0 44px 70px -48px color-mix(in srgb, --text-- 85%, transparent); transition: box-shadow 0.4s ease; }
  .modulex-yorum-terminal-pencere:hover { box-shadow: 0 50px 80px -46px color-mix(in srgb, --accent-- 55%, transparent); }
  .modulex-yorum-terminal-cubuk { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-block-end: 1px solid color-mix(in srgb, --bg-- 14%, transparent); background-color: color-mix(in srgb, --text-- 82%, --bg--); }
  .modulex-yorum-terminal-tus { width: 12px; height: 12px; border-radius: 50%; background: color-mix(in srgb, --bg-- 34%, transparent); }
  .modulex-yorum-terminal-tus:first-child { background: --accent--; }
  .modulex-yorum-terminal-tus:nth-child(2) { background: --yildiz--; }
  .modulex-yorum-terminal-yol { overflow: hidden; margin-inline-start: 10px; color: color-mix(in srgb, --bg-- 76%, --text--); font-size: 0.8rem; text-overflow: ellipsis; white-space: nowrap; }
  .modulex-yorum-terminal-log { display: grid; gap: 24px; padding: clamp(20px, 3.4vw, 36px); }
  .modulex-yorum-terminal-kayit { display: grid; gap: 8px; transition: visibility 0s linear calc(var(--i) * 0.6s); }
  .modulex-yorum-terminal--hazir:not(.modulex-yorum-terminal--gor) .modulex-yorum-terminal-kayit, .modulex-yorum-terminal--hazir:not(.modulex-yorum-terminal--gor) .modulex-yorum-terminal-son { visibility: hidden; transition: none; }
  .modulex-yorum-terminal-komut { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: baseline; gap: 4px 12px; }
  .modulex-yorum-terminal-yaz { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
  .modulex-yorum-terminal--gor .modulex-yorum-terminal-yaz { animation: modulex-yorum-terminal-yaz 0.8s steps(16, end) both; animation-delay: calc(var(--i) * 0.6s); }
  [dir="rtl"] .modulex-yorum-terminal--gor .modulex-yorum-terminal-yaz { animation-name: modulex-yorum-terminal-yaz-rtl; }
  .modulex-yorum-terminal--gor .modulex-yorum-terminal-kayit .modulex-yorum-terminal-alinti, .modulex-yorum-terminal--gor .modulex-yorum-terminal-skor { animation: modulex-yorum-terminal-bas 0.35s ease both; animation-delay: calc(var(--i) * 0.6s + 0.7s); }
  @keyframes modulex-yorum-terminal-yaz { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes modulex-yorum-terminal-yaz-rtl { from { clip-path: inset(0 0 0 100%); } to { clip-path: inset(0 0 0 0); } }
  @keyframes modulex-yorum-terminal-bas { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .modulex-yorum-terminal-istem, .modulex-yorum-terminal-kim { color: color-mix(in srgb, --accent-- 45%, --bg--); font-weight: 800; }
  .modulex-yorum-terminal-istem { display: inline-block; }
  .modulex-yorum-terminal-rol { color: color-mix(in srgb, --bg-- 74%, --text--); }
  .modulex-yorum-terminal-zaman { color: color-mix(in srgb, --bg-- 66%, --text--); font-size: 0.8rem; text-align: end; }
  .modulex-yorum-terminal-alinti { padding-inline-start: 22px; border-inline-start: 2px solid color-mix(in srgb, --bg-- 22%, transparent); line-height: 1.75; }
  .modulex-yorum-terminal-skor { padding-inline-start: 24px; color: --yildiz--; font-size: 1.15rem; letter-spacing: 0.16em; line-height: 1; }
  .modulex-yorum-terminal-skor-bos { opacity: 0.4; }
  .modulex-yorum-terminal-son { display: flex; align-items: center; gap: 10px; }
  .modulex-yorum-terminal-imlec { width: 10px; height: 1.2em; background: --bg--; animation: modulex-yorum-terminal-imlec 1.1s steps(1, end) infinite; }
  @keyframes modulex-yorum-terminal-imlec { 50% { visibility: hidden; } }
  .modulex-yorum-terminal-pencere:hover .modulex-yorum-terminal-imlec { background: color-mix(in srgb, --accent-- 45%, --bg--); }
  @media (max-width: 768px) {
    .modulex-yorum-terminal-pencere { font-size: 0.86rem; border-radius: 10px; }
    .modulex-yorum-terminal-log { gap: 20px; }
    .modulex-yorum-terminal-alinti, .modulex-yorum-terminal-skor { padding-inline-start: 14px; }
    .modulex-yorum-terminal-zaman { grid-column: 2 / -1; text-align: start; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-yorum-terminal :is(.modulex-yorum-terminal-baslik, .modulex-yorum-terminal-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-yorum-terminal-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-yorum-terminal { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-yorum-terminal *, .modulex-yorum-terminal *::before, .modulex-yorum-terminal *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-yorum-terminal";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
    });
  })();
</script>
